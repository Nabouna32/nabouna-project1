name: Browser E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Start Next.js
        run: npm run start > /tmp/utiluna-next.log 2>&1 &

      - name: Wait for Next.js
        run: npx --yes wait-on@9.0.1 http://127.0.0.1:3000/fr

      - name: Run browser smoke tests
        run: npx --yes @playwright/test@1.63.0 test e2e/smoke.spec.mjs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/utiluna-next.log
          if-no-files-found: ignore
