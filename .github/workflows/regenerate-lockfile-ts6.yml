name: Regenerate TypeScript 6 lockfile

on:
  push:
    branches:
      - chore/upgrade-typescript-6

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/upgrade-typescript-6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --package-lock-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date."
          else
            git add package-lock.json
            git commit -m "chore: regenerate package lockfile for TypeScript 6"
            git push origin chore/upgrade-typescript-6
          fi
