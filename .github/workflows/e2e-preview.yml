name: Browser Preview E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: e2e-preview-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright smoke tests on Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Vercel skip marker
        id: vercel_skip
        shell: bash
        run: |
          if git log -1 --format=%B | grep -Fqi '[skip vercel]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Vercel Preview validation skipped for this commit.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.vercel_skip.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        if: steps.vercel_skip.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright test runner
        if: steps.vercel_skip.outputs.skip != 'true'
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Playwright Chromium
        if: steps.vercel_skip.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Get GitHub Actions OIDC token
        if: steps.vercel_skip.outputs.skip != 'true'
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Wait for Vercel Preview
        if: steps.vercel_skip.outputs.skip != 'true'
        id: preview
        uses: actions/github-script@v8
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const deadline = Date.now() + 10 * 60 * 1000;
            let lastState = "not found";

            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: process.env.SHA,
                per_page: 20,
              });

              const vercelDeployments = deployments.filter((deployment) =>
                deployment.environment === "Preview" ||
                deployment.description?.toLowerCase().includes("vercel") ||
                deployment.creator?.login?.toLowerCase().includes("vercel")
              );

              for (const deployment of vercelDeployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 10,
                });

                const status = statuses[0];
                if (!status) continue;

                lastState = `${deployment.id}: ${status.state}`;
                if (status.state === "success" && status.environment_url) {
                  core.setOutput("url", status.environment_url.replace(/\/$/, ""));
                  core.info(`Vercel Preview ready: ${status.environment_url}`);
                  return;
                }

                if (["error", "failure", "inactive"].includes(status.state)) {
                  core.setFailed(`Vercel Preview deployment ${deployment.id} ended with state: ${status.state}`);
                  return;
                }
              }

              core.info(`Waiting for Vercel Preview (${lastState})...`);
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            core.setFailed(`Timed out waiting for Vercel Preview (${lastState}).`);

      - name: Run browser smoke tests
        if: steps.vercel_skip.outputs.skip != 'true'
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: npx playwright test e2e/smoke.spec.mjs

      - name: Upload Playwright report on failure
        if: failure() && steps.vercel_skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-preview-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
